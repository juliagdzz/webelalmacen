    <main class="contenedor compra">
    <div class="titulo-compra">
      <h1>Lista de la compra</h1>
      <button type="button" id="compartir-lista" class="boton secundario" hidden>Compartir</button>
    </div>
    <p class="entradilla">Apunta lo que te falta para el taller y táchalo en la tienda. Busca esmaltes y pastas del catálogo o escribe lo que sea.</p>

    <form id="form-compra" class="anadir-compra" autocomplete="off">
      <div class="campo-compra">
        <input id="nueva-cosa" type="search" enterkeyhint="done" maxlength="120" placeholder="¿Qué necesitas? Fresa, PRAI, esponjas…" aria-label="Qué necesitas">
        <button type="submit" class="boton">Añadir</button>
      </div>
      <ul id="sugerencias-compra" class="sugerencias-compra"></ul>
      <div id="rapidas" class="rapidas" aria-label="Para añadir de un toque"></div>
    </form>

    <p id="resumen-compra" class="resumen-compra"></p>
    <div id="por-comprar"></div>
    <section id="comprado" class="comprado" hidden>
      <div class="cabeza-comprado">
        <h2>En el carro <small id="n-comprado"></small></h2>
        <button type="button" id="quitar-comprados" class="boton texto">Quitar lo comprado</button>
      </div>
      <ul id="lista-comprado" class="lista-compra"></ul>
    </section>
  </main>
